<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>怀旧小游戏合集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: #1a1a1a;
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background-color: #2d2d2d;
            padding: 32px;
            border-radius: 12px;
            width: 340px;
        }
        .login-card h2 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 22px;
        }
        .item {
            margin-bottom: 16px;
        }
        .item input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
            outline: none;
        }
        #loginBtn {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 8px;
        }
        #errMsg {
            color: #ff5555;
            text-align: center;
            margin-top: 12px;
            display: none;
        }
        .game-container {
            display: none;
            width: 100%;
            height: 100vh;
            padding: 30px;
        }
        .title {
            font-size: 28px;
            margin-bottom: 24px;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .game-item {
            background: #333;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .game-item:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <div class="login-card" id="loginBox">
        <h2>登录进入游戏</h2>
        <div class="item">
            <input type="text" id="user" placeholder="账号">
        </div>
        <div class="item">
            <input type="text" id="pwd" placeholder="密码">
        </div>
        <button id="loginBtn">登录</button>
        <div id="errMsg">账号或密码错误</div>
    </div>

    <div class="game-container" id="gameBox">
        <div class="title">🎮 怀旧小游戏合集</div>
        <div class="grid">
            <div class="game-item">贪吃蛇</div>
            <div class="game-item">俄罗斯方块</div>
            <div class="game-item">消消乐</div>
            <div class="game-item">五子棋</div>
            <div class="game-item">扫雷</div>
        </div>
    </div>

<script>
const userInput = document.getElementById('user');
const pwdInput = document.getElementById('pwd');
const loginBtn = document.getElementById('loginBtn');
const errMsg = document.getElementById('errMsg');
const loginBox = document.getElementById('loginBox');
const gameBox = document.getElementById('gameBox');

// 账号密码
const validUser = "杨发勇";
const validPwd = "蠢蛋";

loginBtn.onclick = function(){
    const u = userInput.value.trim();
    const p = pwdInput.value.trim();
    if(u === validUser && p === validPwd){
        loginBox.style.display = 'none';
        gameBox.style.display = 'block';
        errMsg.style.display = 'none';
    }else{
        errMsg.style.display = 'block';
    }
}
</script>
</body>
</html>
